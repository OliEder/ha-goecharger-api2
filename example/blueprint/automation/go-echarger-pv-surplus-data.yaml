blueprint:
  name: go-eCharger PV Surplus Charging
  description: |
    Flexible blueprint for transmitting solar system data to go-eCharger for PV surplus charging.

    **Requirements:** This blueprint requires the go-eCharger API2 integration from
    [marq24/ha-goecharger-api2](https://github.com/marq24/ha-goecharger-api2)

    **Data Transmission:**
    - Daylight (sunrise to sunset), car connected: real PV data every 5 seconds (required by go-eCharger).
    - Night, car connected: zero values every 30 seconds.
    - At sunset: one immediate zero push, even if no car is connected.

    **Invalid measurements (daylight):** If a used power source is missing, non-numeric or
    non-finite, the measurement is not trusted and nothing is replaced by a made-up value.
    By default the blueprint then sends zero values, because a charger that keeps its last
    averages can go on charging from the grid. Use *Reaction to invalid daylight
    measurements* to choose differently: send zero values (default), skip the update and
    notify, or skip the update silently. Skipping leaves the charger on its last received
    values and does NOT stop it. For a short outage tolerance, additionally select a *Grace
    period helper* (see below). The age of numeric measurements is not checked.
    A missing battery reading is handled separately (*Battery sensor unavailable*): by
    default only the battery value is sent as 0 and charging continues with real PV and
    grid data.

    The zero values keep the go-eCharger from working with stale `pvopt_*` averages. The
    charger calculates these averages from the last values it has received, no matter how
    old they are. Without the zero values, a car that is (re)connected at night can start
    charging at sunrise on the basis of yesterday's surplus.

    **Units:** The go-eCharger expects watts. If your entities report kW, set the
    *Power Unit Multiplier* to 1000. If they report W, keep the default of 1. The factor is
    applied to the grid, PV and battery values.

    **Configuration Sections:** The input fields are organized into three grid power measurement methods:
    - Single Entity: Use one entity with positive/negative values
    - Consumption + Feed-in: Use separate entities for grid consumption and feed-in
    - 3-Phase Entities: Use individual entities for L1, L2, L3 phases

    Choose only ONE grid method that matches your inverter's entity structure.
  domain: automation
  author: OliEder
  homeassistant:
    min_version: 2024.6.0
  input:
    charger_config_entry:
      name: Target go-eCharger (optional)
      description: >
        Select the go-eCharger integration entry to receive all data, including
        night and sunset zeros. Required when using multiple chargers. Leave
        empty to keep the service's default charger selection. When selected,
        choose explicit Car connected entities from this same integration entry;
        device and area targets are not supported with an explicit charger.
      default: ""
      selector:
        config_entry:
          integration: goecharger_api2

    invalid_data_policy:
      name: Reaction to invalid daylight measurements
      description: >
        What to do in daylight while a used power source is missing, non-numeric
        or non-finite (for example "unavailable" after an inverter or integration
        restart).


        Zero (default): send 0/0/0. The go-eCharger keeps the averages of the
        last values it received, no matter how old they are. Without new data it
        could go on charging with surplus that no longer exists, and so draw
        power from the grid. Zero values make the charger drop to its minimum
        or stop, depending on its PV settings. Night and sunset use the same
        zero values.


        Notify: skip the update and create a persistent notification (one per
        automation, replaced about once a minute). The charger continues with
        its last values and can charge from the grid meanwhile.


        Keep: skip the update silently. Same risk as Notify, without a message.
        Choose this only if continued charging on old values is what you want.


        The reaction starts immediately unless you also select a Grace period
        helper. Valid measurements always resume normal transmission on the
        next daylight tick. Night and sunset zero values are not affected.
      default: zero
      selector:
        select:
          mode: dropdown
          options:
            - label: Send zero values (recommended)
              value: zero
            - label: Skip update and notify
              value: notify
            - label: Keep last values (skip update silently)
              value: keep

    last_valid_helper:
      name: Grace period helper (optional)
      description: >
        OPTIONAL. Leave empty if you do not need a grace period; the blueprint
        works without it and the reaction above starts immediately.


        Select an input_datetime helper of type "Date and time" that you created
        yourself (Settings > Devices & services > Helpers > Create helper >
        Date and/or time > enable both Date and Time). Use one helper per
        automation. Do not share it with anything else.


        The blueprint stores the time of the last valid measurement in this
        helper. With a helper, the reaction only starts when no valid
        measurement has been seen for longer than the grace period. This avoids
        reacting to short dropouts, for example when an integration reloads.


        The helper is written about every half grace period while measurements
        are valid, not on every 5 second tick, to keep database writes low. If
        the helper is empty or unknown, the grace period counts as expired.
        Without valid data since HA started with an empty helper, the reaction
        therefore starts immediately.
      default: ""
      selector:
        entity:
          domain: input_datetime

    invalid_data_grace:
      name: Grace period (seconds)
      description: >
        Only used when a Grace period helper is selected. Time without valid
        measurements that is tolerated before the reaction starts. Shorter
        than 30 seconds is not supported, because the helper is refreshed
        about every half grace period.
      default: 60
      selector:
        number:
          min: 30
          max: 3600
          step: 10
          unit_of_measurement: s
          mode: box

    car_connected:
      name: Car connected Entity
      description: Entity from go-eCharger API2 integration that indicates the vehicle connection status
      input:
        car_connected_entity:
          name: Car connected
          description: Entity from go-eCharger API2 integration that indicates the vehicle connection status
          selector:
            target:
              entity:
                - integration: goecharger_api2
                  domain: binary_sensor

    power_multiplier:
      name: Power Unit Multiplier
      description: >
        Factor applied to all power values (grid, PV and battery) before they are sent to
        the go-eCharger, which expects watts. Use 1 if your entities report W (default),
        1000 if they report kW.
      default: 1
      selector:
        number:
          min: 0.001
          max: 1000000
          step: any
          mode: box

    grid_single:
      name: Grid Power - Single Entity
      description: Use ONE entity with positive (import) and negative (export) values
      collapsed: true
      input:
        grid_single_entity:
          name: Grid Power Entity
          description: Entity with +/- values (positive = import, negative = export)
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        grid_single_invert:
          name: Invert Values
          description: Enable if positive means export instead of import
          default: false
          selector:
            boolean:

    grid_dual:
      name: Grid Power - Consumption + Feed-in
      description: Use separate entities for grid consumption and feed-in (both always positive)
      collapsed: true
      input:
        grid_consumption_entity:
          name: Grid Consumption Entity
          description: Grid consumption (always positive)
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        grid_feedin_entity:
          name: Grid Feed-in Entity
          description: Grid feed-in (always positive)
          default:
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power

    grid_phases:
      name: Grid Power - 3-Phase Entities
      description: Use individual entities for each phase (L1, L2, L3) - all three will be summed
      collapsed: true
      input:
        grid_phase_entities:
          name: Grid Phase Entities (L1, L2, L3)
          description: Select exactly 3 entities for phases L1, L2, L3
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: power
        grid_phases_invert:
          name: Invert Phase Values
          description: Enable if positive means export instead of import
          default: false
          selector:
            boolean:

    pv_entities:
      name: PV Power Entities
      description: One or more PV entities (required)
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
              device_class: power

    pv_invert:
      name: Invert PV Power Values
      description: Enable if PV entities use negative values for generation
      default: false
      selector:
        boolean:

    battery_enabled:
      name: Enable Battery Data Transmission
      description: Send battery data to go-eCharger
      default: true
      selector:
        boolean:

    battery_entities:
      name: Battery Power Entities
      description: One or more battery entities (optional)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
              device_class: power

    battery_invert:
      name: Invert Battery Power Values
      description: Enable if positive values mean charging instead of discharging
      default: false
      selector:
        boolean:

    battery_unavailable_policy:
      name: Battery sensor unavailable
      description: >
        What to do in daylight while a selected battery entity is unavailable,
        unknown or not numeric. Only used when battery transmission is enabled.


        Send battery 0 (default): the battery value is sent as 0, all other data
        stays real. Charging from PV surplus continues. If any selected battery
        entity is invalid, the whole battery value is 0; the remaining entities
        are not summed. With 0 the charger assumes the battery is neither
        charging nor discharging. If your battery often charges or discharges
        with high power, the surplus the charger sees can then be too high or
        too low until the sensor is back.


        Treat as invalid: handle it like any other invalid measurement, using
        the setting Reaction to invalid daylight measurements (zero values by
        default).
      default: zero
      selector:
        select:
          mode: dropdown
          options:
            - label: Send battery 0, keep other data (recommended)
              value: zero
            - label: Treat as invalid measurement
              value: invalid

variables:
  charger_config_entry: !input charger_config_entry
  invalid_data_policy: !input invalid_data_policy
  last_valid_helper: !input last_valid_helper
  invalid_data_grace: !input invalid_data_grace
  car_connected_entity: !input car_connected_entity
  charger_target_valid: >
    {% if not charger_config_entry %}
      {{ true }}
    {% else %}
      {% set entities = car_connected_entity.get('entity_id', []) %}
      {% set entities = [entities] if entities is string else entities %}
      {% set ns = namespace(valid=entities | length > 0
        and not car_connected_entity.get('device_id')
        and not car_connected_entity.get('area_id')
        and config_entry_attr(charger_config_entry, 'domain') == 'goecharger_api2') %}
      {% for entity in entities %}
        {% if config_entry_id(entity) != charger_config_entry %}
          {% set ns.valid = false %}
        {% endif %}
      {% endfor %}
      {{ ns.valid }}
    {% endif %}
  multiplier: !input power_multiplier
  grid_single_entity: !input grid_single_entity
  grid_single_invert: !input grid_single_invert
  grid_consumption: !input grid_consumption_entity
  grid_feedin: !input grid_feedin_entity
  grid_phases: !input grid_phase_entities
  grid_phases_invert: !input grid_phases_invert
  pv_list: !input pv_entities
  pv_invert_flag: !input pv_invert
  battery_enable: !input battery_enabled
  battery_list: !input battery_entities
  battery_invert_flag: !input battery_invert
  battery_unavailable_policy: !input battery_unavailable_policy

  # Preserve method precedence; an incomplete selected method must not fall back.
  # No grid method selected sends pgrid 0, as in earlier versions. Phases use the
  # first three entities, as before; fewer than three, or duplicates, are invalid.
  # An empty entity ID in the list marks the selection as invalid.
  grid_sources: >
    {% if grid_single_entity %}
      {{ [grid_single_entity] }}
    {% elif grid_consumption or grid_feedin %}
      {{ [grid_consumption, grid_feedin] }}
    {% elif grid_phases | length >= 3 and grid_phases[:3] | unique | list | length == 3 %}
      {{ grid_phases[:3] }}
    {% elif grid_phases | length > 0 %}
      {{ [''] }}
    {% else %}
      {{ [] }}
    {% endif %}
  # Capture each used state once, so validation and arithmetic use the same sample.
  power_samples: >
    {% set ns = namespace(samples={}) %}
    {% for entity in (grid_sources + pv_list + (battery_list if battery_enable else [])) | unique %}
      {% set ns.samples = dict(ns.samples, **{entity: states(entity)}) if entity else ns.samples %}
    {% endfor %}
    {{ ns.samples }}
  # Battery entities only invalidate the update when the user chose "invalid".
  # Otherwise an unusable battery reading is sent as 0 (see pakku_value).
  battery_ok: >
    {% set ns = namespace(valid=true) %}
    {% for entity in (battery_list if battery_enable else []) %}
      {% if not entity or not is_number(power_samples.get(entity)) %}
        {% set ns.valid = false %}
      {% endif %}
    {% endfor %}
    {{ ns.valid }}
  measurements_valid: >
    {% set ns = namespace(valid=pv_list | length > 0
      and is_number(multiplier) and multiplier | float(0) > 0
      and (battery_ok or battery_unavailable_policy != 'invalid')) %}
    {% for entity in grid_sources + pv_list %}
      {% if not entity or not is_number(power_samples.get(entity)) %}
        {% set ns.valid = false %}
      {% endif %}
    {% endfor %}
    {{ ns.valid }}

  pgrid_value: >
    {% if grid_single_entity %}
      {% set value = power_samples.get(grid_single_entity) | float(0) %}
      {{ (value * -1) if grid_single_invert else value }}
    {% elif grid_consumption and grid_feedin %}
      {% set cons_val = power_samples.get(grid_consumption) | float(0) %}
      {% set feed_val = power_samples.get(grid_feedin) | float(0) %}
      {{ cons_val - feed_val }}
    {% elif grid_phases | length >= 3 %}
      {% set ns = namespace(total=0) %}
      {% for entity in grid_phases[:3] %}
        {% set ns.total = ns.total + (power_samples.get(entity) | float(0)) %}
      {% endfor %}
      {{ (ns.total * -1) if grid_phases_invert else ns.total }}
    {% else %}
      0
    {% endif %}

  ppv_value: >
    {% set ns = namespace(total=0) %}
    {% for entity in pv_list %}
      {% set ns.total = ns.total + (power_samples.get(entity) | float(0)) %}
    {% endfor %}
    {{ (ns.total * -1) if pv_invert_flag else ns.total }}

  pakku_value: >
    {% if battery_enable and battery_ok %}
      {% set ns = namespace(total=0) %}
      {% for entity in battery_list %}
        {% set ns.total = ns.total + (power_samples.get(entity) | float(0)) %}
      {% endfor %}
      {{ (ns.total * -1) if battery_invert_flag else ns.total }}
    {% else %}
      0
    {% endif %}

  pgrid_watts: '{{ (pgrid_value | float(0)) * (multiplier | float(0)) }}'
  ppv_watts: '{{ (ppv_value | float(0)) * (multiplier | float(0)) }}'
  pakku_watts: '{{ (pakku_value | float(0)) * (multiplier | float(0)) }}'

  # Seconds since the last valid measurement was stored in the optional helper.
  # An empty or unknown helper parses to 0 and therefore counts as very old.
  helper_age: >
    {{ (now().timestamp() - as_timestamp(states(last_valid_helper), 0))
      if last_valid_helper else 0 }}
  # Without helper there is no grace period: the reaction starts immediately.
  grace_expired: >
    {{ not last_valid_helper
      or (helper_age | float(0)) > (invalid_data_grace | float(60)) }}
  # Refresh at half the grace period: age stays below the grace period while
  # data is valid, and the helper is written far less often than every tick.
  helper_refresh_due: >
    {{ last_valid_helper != ""
      and (helper_age | float(0)) > (invalid_data_grace | float(60)) / 2 }}

triggers:
  - trigger: time_pattern
    seconds: /5
    id: tick
  - trigger: sun
    event: sunset
    id: sunset

actions:
  - if:
      - condition: template
        value_template: '{{ not charger_target_valid }}'
    then:
      # A misconfiguration repeats on every 5 second tick. "stop ... error: true"
      # would write an error to the log each time, so the problem is shown in a
      # notification instead (replaced, at most once per minute) and the run ends
      # quietly. The trace still shows the stop reason.
      - if:
          - condition: template
            value_template: '{{ now().second < 5 }}'
        then:
          - action: persistent_notification.create
            data:
              notification_id: "goecharger_pv_target_{{ this.entity_id }}"
              title: "go-eCharger PV surplus: invalid target charger"
              message: >
                No data is sent. Select Car connected entities that belong
                to the selected target go-eCharger integration entry, or clear
                the target. Device and area targets are not supported with an
                explicit target charger.
      - stop: "Select Car connected entities belonging to the target go-eCharger integration entry."
  - choose:
      # Daylight, car connected: real data every 5 seconds
      - conditions:
          - condition: trigger
            id: tick
          - condition: template
            value_template: '{{ expand(car_connected_entity.entity_id) | selectattr("state", "eq", "on") | list | count > 0 }}'
          - condition: sun
            after: sunrise
          - condition: sun
            before: sunset
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ measurements_valid and is_number(pgrid_watts)
                    and is_number(ppv_watts) and is_number(pakku_watts) }}
            then:
              - action: goecharger_api2.set_pv_data
                data: >
                  {% set payload = dict(
                    pgrid=(pgrid_watts | float) | round(0) | int,
                    ppv=(ppv_watts | float) | round(0) | int,
                    pakku=(pakku_watts | float) | round(0) | int) %}
                  {{ dict(payload, configid=charger_config_entry) if charger_config_entry else payload }}
              # Remember the last valid measurement for the optional grace period
              - if:
                  - condition: template
                    value_template: '{{ helper_refresh_due }}'
                then:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: '{{ last_valid_helper }}'
                    data:
                      timestamp: '{{ now().timestamp() | int }}'
            else:
              - if:
                  - condition: template
                    alias: "Grace period over (or no helper selected)"
                    value_template: '{{ grace_expired }}'
                then:
                  - choose:
                      - alias: "Invalid measurement: send zero values"
                        conditions:
                          - condition: template
                            value_template: '{{ invalid_data_policy == "zero" }}'
                        sequence:
                          - action: goecharger_api2.set_pv_data
                            data: >
                              {% set payload = dict(pgrid=0, ppv=0, pakku=0) %}
                              {{ dict(payload, configid=charger_config_entry) if charger_config_entry else payload }}
                      - alias: "Invalid measurement: notify"
                        conditions:
                          - condition: template
                            value_template: '{{ invalid_data_policy == "notify" }}'
                        sequence:
                          # At most once per minute; the notification keeps its id
                          - condition: template
                            value_template: '{{ now().second < 5 }}'
                          - action: persistent_notification.create
                            data:
                              notification_id: "goecharger_pv_invalid_data_{{ this.entity_id }}"
                              title: "go-eCharger PV surplus: invalid measurement"
                              message: >
                                A used power source is unavailable or non-numeric. The
                                charger keeps working with its last received values.

      # Night, car connected: zeros every 30 seconds (flushes stale averages)
      - conditions:
          - condition: trigger
            id: tick
          - condition: template
            value_template: '{{ expand(car_connected_entity.entity_id) | selectattr("state", "eq", "on") | list | count > 0 }}'
          - condition: not
            conditions:
              - condition: and
                conditions:
                  - condition: sun
                    after: sunrise
                  - condition: sun
                    before: sunset
          - condition: template
            value_template: '{{ now().second % 30 < 5 }}'
        sequence:
          - action: goecharger_api2.set_pv_data
            data: >
              {% set payload = dict(pgrid=0, ppv=0, pakku=0) %}
              {{ dict(payload, configid=charger_config_entry) if charger_config_entry else payload }}

      # Sunset: one immediate zero push, regardless of car connection
      - conditions:
          - condition: trigger
            id: sunset
        sequence:
          - action: goecharger_api2.set_pv_data
            data: >
              {% set payload = dict(pgrid=0, ppv=0, pakku=0) %}
              {{ dict(payload, configid=charger_config_entry) if charger_config_entry else payload }}

mode: single
# A slow charger call (e.g. via cloud) can overrun the 5 second tick. The next tick
# is then dropped; without this, HA logs an "Already running" warning every time.
max_exceeded: silent
